<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Atividades - Telecom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 p-2 sm:p-4 font-sans">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200">
        <div class="bg-slate-800 p-4 flex justify-between items-center text-white">
            <div>
                <h2 class="font-bold text-lg">Registro de Atividade</h2>
                <p id="displayData" class="text-xs text-slate-400"></p>
            </div>
            <button onclick="abrirModal()" class="text-slate-400 hover:text-white p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                </svg>
            </button>
        </div>

        <form id="atividadeForm" class="p-5 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Data</label>
                    <input type="date" id="dataAtividade" class="w-full rounded-lg border-slate-300 shadow-sm p-2 bg-slate-50 border outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Hora</label>
                    <input type="time" id="horaAtividade" class="w-full rounded-lg border-slate-300 shadow-sm p-2 bg-slate-50 border outline-none text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Site</label>
                <select id="site" onchange="atualizarLocais()" class="w-full rounded-lg border-slate-300 shadow-sm p-3 bg-white border focus:ring-2 focus:ring-blue-500 outline-none text-sm" required>
                    <option value="">Selecione o Site</option>
                    <option value="JBE">JBE</option>
                    <option value="JPO">JPO</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Local</label>
                <select id="local" class="w-full rounded-lg border-slate-300 shadow-sm p-3 bg-white border focus:ring-2 focus:ring-blue-500 outline-none text-sm" required disabled>
                    <option value="">Selecione o Site primeiro</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Equipe Executante</label>
                <div id="listaExecutantes" class="custom-scroll grid grid-cols-1 gap-1 max-h-32 overflow-y-auto p-3 border rounded-lg bg-slate-50 text-sm"></div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Equipe de Apoio</label>
                <div id="listaApoio" class="custom-scroll grid grid-cols-1 gap-1 max-h-32 overflow-y-auto p-3 border rounded-lg bg-slate-50 text-sm"></div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Status</label>
                <select id="status" class="w-full rounded-lg border-slate-300 shadow-sm p-3 border outline-none text-sm font-bold text-blue-600">
                    <option value="Concluído">✅ Concluído</option>
                    <option value="Em Andamento">⏳ Em Andamento</option>
                </select>
            </div>

            <button type="button" onclick="enviarWhatsApp()" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl hover:bg-green-700 transition shadow-md flex items-center justify-center gap-2 mt-4 active:scale-95">
                ENVIAR PARA WHATSAPP
            </button>
        </form>
    </div>

    <div id="modalAdm" class="modal flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="bg-slate-200 p-4 flex justify-between items-center shrink-0">
                <span class="font-bold text-slate-700 uppercase text-sm tracking-widest">Painel ADM</span>
                <button onclick="fecharModal()" class="text-slate-500 text-3xl leading-none">&times;</button>
            </div>
            
            <div class="p-4 space-y-6 overflow-y-auto custom-scroll">
                
                <section>
                    <h3 class="text-xs font-black text-orange-600 uppercase mb-2">Gerenciar Locais</h3>
                    <div class="space-y-2 mb-2">
                        <select id="siteAdmLocal" class="w-full border rounded p-2 text-sm outline-none">
                            <option value="JBE">Site JBE</option>
                            <option value="JPO">Site JPO</option>
                        </select>
                        <div class="flex gap-2">
                            <input type="text" id="novoLocal" placeholder="Nome do Local..." class="flex-1 border rounded p-2 text-sm outline-none">
                            <button onclick="adicionarLocal()" class="bg-orange-600 text-white px-4 py-1 rounded font-bold">+</button>
                        </div>
                    </div>
                    <div id="admListaLocais" class="space-y-1 text-xs"></div>
                </section>

                <hr>

                <section>
                    <h3 class="text-xs font-black text-blue-600 uppercase mb-2">Gerenciar Executantes</h3>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="novoExec" placeholder="Nome..." class="flex-1 border rounded p-2 text-sm outline-none">
                        <button onclick="adicionarPessoa('exec')" class="bg-blue-600 text-white px-4 py-1 rounded font-bold">+</button>
                    </div>
                    <div id="admListaExec" class="space-y-1 text-xs"></div>
                </section>

                <hr>

                <section>
                    <h3 class="text-xs font-black text-green-600 uppercase mb-2">Gerenciar Apoio</h3>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="novoApoio" placeholder="Nome..." class="flex-1 border rounded p-2 text-sm outline-none">
                        <button onclick="adicionarPessoa('apoio')" class="bg-green-600 text-white px-4 py-1 rounded font-bold">+</button>
                    </div>
                    <div id="admListaApoio" class="space-y-1 text-xs"></div>
                </section>
            </div>
        </div>
    </div>

    <script>
        // Dados Iniciais
        const iniciaisLocais = {
            'JBE': ["Escritório ADM", "Portaria", "Restaurante", "Subestação Principal", "Oficina Central", "ETA", "Sala de Controle", "Torre de Telecomunicações"],
            'JPO': ["Escritório ADM", "Portaria", "Subestação Principal", "Oficina MPOR", "Sala de Controle", "Sala de Telecom Pier", "Sala de Telecom", "Torre de Telecomunicações"]
        };
        const iniciaisExec = ["Adriano Nascimento", "Cezar Prado", "Deivison Aleidson", "Deivison Barros", "Edenildo Rodrigues", "Ezequiel", "Francivaldo Costa", "Jean Soares", "Jeiel Lobato", "Joelcinei Guimarães", "José Antônio", "Juenisson Belem", "Lucas Santos", "Matheus Costa", "Rafael Gonçalves", "Reginaldo Pereira", "Welyton Pereira"];
        const iniciaisApoio = ["Joelcinei", "Francivaldo", "Adriano Nascimento", "Ezequiel", "Reginaldo"];

        let executantes = JSON.parse(localStorage.getItem('equipeExec')) || iniciaisExec;
        let apoios = JSON.parse(localStorage.getItem('equipeApoio')) || iniciaisApoio;
        let locaisDb = JSON.parse(localStorage.getItem('locaisTelecom')) || iniciaisLocais;

        function renderizarTudo() {
            // Renderiza Executantes
            const fExec = document.getElementById('listaExecutantes');
            const aExec = document.getElementById('admListaExec');
            fExec.innerHTML = ''; aExec.innerHTML = '';
            executantes.sort().forEach((n, i) => {
                fExec.innerHTML += `<label class="flex items-center space-x-2 p-1 border-b border-slate-100 last:border-0"><input type="checkbox" name="execCheck" value="${n}" class="w-4 h-4 text-blue-600 rounded"><span>${n}</span></label>`;
                aExec.innerHTML += `<div class="flex justify-between p-1 bg-slate-50 border rounded items-center"><span>${n}</span><button onclick="removerPessoa('exec', ${i})" class="text-red-500 font-bold p-1 italic text-[10px]">REMOVER</button></div>`;
            });

            // Renderiza Apoios
            const fApoio = document.getElementById('listaApoio');
            const aApoio = document.getElementById('admListaApoio');
            fApoio.innerHTML = ''; aApoio.innerHTML = '';
            apoios.sort().forEach((n, i) => {
                fApoio.innerHTML += `<label class="flex items-center space-x-2 p-1 border-b border-slate-100 last:border-0"><input type="checkbox" name="apoioCheck" value="${n}" class="w-4 h-4 text-green-600 rounded"><span>${n}</span></label>`;
                aApoio.innerHTML += `<div class="flex justify-between p-1 bg-slate-50 border rounded items-center"><span>${n}</span><button onclick="removerPessoa('apoio', ${i})" class="text-red-500 font-bold p-1 italic text-[10px]">REMOVER</button></div>`;
            });

            // Renderiza Lista ADM de Locais (baseado no site selecionado no ADM)
            renderizarListaAdmLocais();

            localStorage.setItem('equipeExec', JSON.stringify(executantes));
            localStorage.setItem('equipeApoio', JSON.stringify(apoios));
            localStorage.setItem('locaisTelecom', JSON.stringify(locaisDb));
            
            atualizarLocais(); // Atualiza o dropdown principal
        }

        function renderizarListaAdmLocais() {
            const siteAdm = document.getElementById('siteAdmLocal').value;
            const aLocais = document.getElementById('admListaLocais');
            aLocais.innerHTML = `<p class="text-[10px] text-slate-400 font-bold mb-1">LOCAIS ATUAIS EM ${siteAdm}:</p>`;
            
            locaisDb[siteAdm].sort().forEach((l, i) => {
                aLocais.innerHTML += `<div class="flex justify-between p-1 bg-slate-50 border rounded items-center"><span>${l}</span><button onclick="removerLocal('${siteAdm}', ${i})" class="text-red-500 font-bold p-1 italic text-[10px]">EXCLUIR</button></div>`;
            });
        }

        // Listener para mudar a lista de locais no ADM ao trocar o site
        document.getElementById('siteAdmLocal').addEventListener('change', renderizarListaAdmLocais);

        function adicionarPessoa(tipo) {
            const input = document.getElementById(tipo === 'exec' ? 'novoExec' : 'novoApoio');
            if (input.value.trim()) {
                if (tipo === 'exec') executantes.push(input.value.trim());
                else apoios.push(input.value.trim());
                input.value = ''; renderizarTudo();
            }
        }

        function removerPessoa(tipo, i) {
            if (confirm("Remover da lista?")) {
                if (tipo === 'exec') executantes.splice(i, 1);
                else apoios.splice(i, 1);
                renderizarTudo();
            }
        }

        function adicionarLocal() {
            const site = document.getElementById('siteAdmLocal').value;
            const input = document.getElementById('novoLocal');
            if (input.value.trim()) {
                locaisDb[site].push(input.value.trim());
                input.value = ''; renderizarTudo();
            }
        }

        function removerLocal(site, i) {
            if (confirm(`Remover este local de ${site}?`)) {
                locaisDb[site].splice(i, 1);
                renderizarTudo();
            }
        }

        function atualizarLocais() {
            const siteSel = document.getElementById('site').value;
            const drop = document.getElementById('local');
            const selecionadoAnterior = drop.value;
            
            drop.innerHTML = '<option value="">Selecione o Local...</option>';
            if (siteSel && locaisDb[siteSel]) {
                drop.disabled = false;
                locaisDb[siteSel].sort().forEach(l => {
                    let o = document.createElement('option');
                    o.value = o.text = l;
                    if(l === selecionadoAnterior) o.selected = true;
                    drop.appendChild(o);
                });
            } else drop.disabled = true;
        }

        function enviarWhatsApp() {
            const selExec = Array.from(document.querySelectorAll('input[name="execCheck"]:checked')).map(c => c.value);
            const selApoio = Array.from(document.querySelectorAll('input[name="apoioCheck"]:checked')).map(c => c.value);
            const site = document.getElementById('site').value;
            const local = document.getElementById('local').value;

            if(!site || !local || selExec.length === 0) {
                alert("Erro: Preencha Site, Local e pelo menos 1 Executante."); return;
            }

            const data = document.getElementById('dataAtividade').value.split('-').reverse().join('/');
            const hora = document.getElementById('horaAtividade').value;

            let msg = `*ATIVIDADE*\nPreventiva de Rack e Sala de Telecom\n\n`;
            msg += `*° DATA/HORA*\n${data} às ${hora}\n\n`;
            msg += `*° SITE*\n${site}\n\n`;
            msg += `*° LOCAL*\n${local}\n\n`;
            msg += `*° COLABORADORES*\n° ${selExec.join('\n° ')}\n\n`;
            msg += `*° APOIO*\n${selApoio.length > 0 ? '° ' + selApoio.join('\n° ') : 'Nenhum'}\n\n`;
            msg += `*° STATUS*\n${document.getElementById('status').value}`;

            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function abrirModal() { document.getElementById('modalAdm').style.display = 'flex'; }
        function fecharModal() { document.getElementById('modalAdm').style.display = 'none'; }
        
        // Setup Inicial
        (function() {
            const n = new Date();
            document.getElementById('dataAtividade').value = n.toISOString().split('T')[0];
            document.getElementById('horaAtividade').value = n.toTimeString().split(' ')[0].substring(0, 5);
            document.getElementById('displayData').innerText = n.toLocaleDateString('pt-BR');
            renderizarTudo();
        })();
    </script>
</body>
</html>
