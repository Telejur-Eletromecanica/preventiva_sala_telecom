<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Atividades - Telecom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 p-2 sm:p-4 font-sans">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200">
        <div class="bg-slate-800 p-4 flex justify-between items-center text-white">
            <div>
                <h2 class="font-bold text-lg">Registro de Atividade</h2>
                <p id="displayData" class="text-xs text-slate-400"></p>
            </div>
            <button onclick="abrirModal()" class="text-slate-400 hover:text-white p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                </svg>
            </button>
        </div>

        <form id="atividadeForm" class="p-5 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase">Data</label>
                    <input type="date" id="dataAtividade" class="w-full rounded border-slate-300 p-2 bg-slate-50 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase">Hora</label>
                    <input type="time" id="horaAtividade" class="w-full rounded border-slate-300 p-2 bg-slate-50 text-sm outline-none">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase">Site</label>
                <select id="site" onchange="atualizarLocais()" class="w-full rounded border p-2 bg-white text-sm outline-none focus:ring-2 focus:ring-slate-400">
                    <option value="">Selecione o Site</option>
                    <option value="JBE">JBE</option>
                    <option value="JPO">JPO</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase">Local</label>
                <select id="local" class="w-full rounded border p-2 bg-white text-sm outline-none focus:ring-2 focus:ring-slate-400" disabled>
                    <option value="">Selecione o Site primeiro</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase">Colaborador</label>
                <select id="executante" class="w-full rounded border p-2 bg-white text-sm outline-none focus:ring-2 focus:ring-slate-400">
                    <option value="">Selecione o Colaborador</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase">Apoio</label>
                <select id="apoio" class="w-full rounded border p-2 bg-white text-sm outline-none focus:ring-2 focus:ring-slate-400">
                    <option value="">Selecione o Apoio (opcional)</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase">Status</label>
                <select id="status" class="w-full rounded border p-2 bg-white text-sm font-bold text-blue-600 outline-none">
                    <option value="Concluído">✅ Concluído</option>
                    <option value="Em Andamento">⏳ Em Andamento</option>
                </select>
            </div>

            <button type="button" onclick="enviarWhatsApp()" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl hover:bg-green-700 transition shadow-md active:scale-95">
                ENVIAR PARA WHATSAPP
            </button>
        </form>
    </div>

    <div id="modalAdm" class="modal flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="bg-slate-200 p-4 flex justify-between items-center">
                <span class="font-bold text-slate-700 uppercase text-xs tracking-widest">Gerenciar Equipe</span>
                <button onclick="fecharModal()" class="text-slate-500 text-2xl leading-none">&times;</button>
            </div>
            <div class="p-4 space-y-4 overflow-y-auto custom-scroll">
                <div class="flex gap-2">
                    <input type="text" id="novoNome" placeholder="Novo nome..." class="flex-1 border rounded p-2 text-sm outline-none">
                    <button onclick="adicionarNome()" class="bg-blue-600 text-white px-4 rounded font-bold">+</button>
                </div>
                <div id="listaNomesAdm" class="space-y-1 text-sm">
                    </div>
            </div>
            <div class="p-4 bg-slate-50 border-t">
                <button onclick="fecharModal()" class="w-full bg-slate-800 text-white py-2 rounded font-bold text-sm">Salvar e Fechar</button>
            </div>
        </div>
    </div>

    <script>
        // LISTA DE LOCAIS
        const locaisData = {
            'JBE': [
                "001B - Escritório ADM", "001B - Escritorio Móvel", "002B - Portaria", "003B - Restaurante", "004B - Ambulatório",
                "006B - Brigada Bombeiros", "112B - Subestação Principal", "114B - Prédio CapEx Lagos", "146B - Laboratório Fisico",
                "146B - Laboratório Quimico", "147B - Almoxarifado", "148A - Oficina Central", "148C - Oficina Veiculos Leves",
                "148F - Oficina de Vagões", "148G - Oficina de Caldeiraria", "149B - Manutenção MTUR", "370B - ETA", "373B - ETE",
                "378B - Prédio do CRAS", "611B - Sala de Telecom da TT", "613B - Posto de Abastecimento", "621B - Empilhadeira",
                "631A - Sala de Controle", "631B - Planta de Lavagem", "641B - Empilhadeira", "641B - Sala de Telecom da TT",
                "642B - Sala de Preparação de Amostras", "661B - Escritório da Lagoa LE", "967B - Torre de Telecomunicações",
                "S372 - Subestação da Captação", "S611 - Subestação Britagem", "S621 - Subestação Pilha Britados",
                "S631 - Subestação Predio Lavagem", "S641 - Subestação Pilha Lavados", "S651 - Subestação Distr. Água",
                "S661 - Subestação da Lagoa"
            ],
            'JPO': [
                "001P - Escritório ADM", "002P - Portaria", "003P - Restaurante", "004P - Ambulatório", "006P - Brigada Bombeiros",
                "112P - Subestação Principal", "126P - Posto de Abastecimento", "147P - Almoxarifado", "148P - Oficina Central",
                "148P - Oficina MPOR", "370P - ETA", "373P - ETE", "410A - Sala de Controle", "410P - Sala de Telecom Pier",
                "412P - Carregador de Navios", "412P - Retomadora", "412P - Sala de Telecom", "415P - Empilhadeira",
                "415P - Sala de Telecom", "602P - Viveiro de Mudas", "967P - Torre de Telecomunicações", "S370 - Sala de Telecom",
                "S412 - Subestação Expedição", "S415 - Subestação Estocagem", "S481 - Subestação Virador de Vagões"
            ]
        };

        const nomesIniciais = ["Adriano Nascimento", "Cezar Prado", "Deivison Aleidson", "Deivison Barros", "Edenildo Rodrigues", "Ezequiel", "Francivaldo Costa", "Jean Soares", "Jeiel Lobato", "Joelcinei Guimarães", "José Antônio", "Juenisson Belem", "Lucas Santos", "Matheus Costa", "Rafael Gonçalves", "Reginaldo Pereira", "Welyton Pereira"];

        let nomesEquipe = JSON.parse(localStorage.getItem('nomesTelecom')) || nomesIniciais;

        function renderizarNomes() {
            const execSel = document.getElementById('executante');
            const apoioSel = document.getElementById('apoio');
            const admLista = document.getElementById('listaNomesAdm');
            
            execSel.innerHTML = '<option value="">Selecione o Colaborador</option>';
            apoioSel.innerHTML = '<option value="">Selecione o Apoio (opcional)</option>';
            admLista.innerHTML = '';

            nomesEquipe.sort().forEach((nome, i) => {
                // Dropdowns do Formulário
                execSel.innerHTML += `<option value="${nome}">${nome}</option>`;
                apoioSel.innerHTML += `<option value="${nome}">${nome}</option>`;
                // Lista de Exclusão no ADM
                admLista.innerHTML += `<div class="flex justify-between bg-slate-50 p-2 border rounded items-center"><span>${nome}</span><button onclick="removerNome(${i})" class="text-red-500 font-bold text-xs uppercase">Excluir</button></div>`;
            });
            localStorage.setItem('nomesTelecom', JSON.stringify(nomesEquipe));
        }

        function adicionarNome() {
            const input = document.getElementById('novoNome');
            if (input.value.trim()) {
                nomesEquipe.push(input.value.trim());
                input.value = '';
                renderizarNomes();
            }
        }

        function removerNome(i) {
            if (confirm("Remover este nome da lista?")) {
                nomesEquipe.splice(i, 1);
                renderizarNomes();
            }
        }

        function atualizarLocais() {
            const site = document.getElementById('site').value;
            const localSel = document.getElementById('local');
            localSel.innerHTML = '<option value="">Selecione o Local</option>';
            
            if (site && locaisData[site]) {
                localSel.disabled = false;
                locaisData[site].forEach(l => {
                    localSel.innerHTML += `<option value="${l}">${l}</option>`;
                });
            } else {
                localSel.disabled = true;
            }
        }

        function enviarWhatsApp() {
            const site = document.getElementById('site').value;
            const local = document.getElementById('local').value;
            const exec = document.getElementById('executante').value;
            const apoio = document.getElementById('apoio').value;
            const status = document.getElementById('status').value;
            const data = document.getElementById('dataAtividade').value.split('-').reverse().join('/');
            const hora = document.getElementById('horaAtividade').value;

            if (!site || !local || !exec) {
                alert("Erro: Preencha Site, Local e Colaborador."); return;
            }

            let msg = `*ATIVIDADE*\nPreventiva de Rack e Sala de Telecom\n\n`;
            msg += `*° DATA/HORA*\n${data} às ${hora}\n\n`;
            msg += `*° SITE*\n${site}\n\n`;
            msg += `*° LOCAL*\n${local}\n\n`;
            msg += `*° COLABORADOR*\n° ${exec}\n\n`;
            msg += `*° APOIO*\n${apoio ? '° ' + apoio : 'Nenhum'}\n\n`;
            msg += `*° STATUS*\n${status}`;

            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function abrirModal() { document.getElementById('modalAdm').style.display = 'flex'; }
        function fecharModal() { document.getElementById('modalAdm').style.display = 'none'; }

        // Inicialização de Data, Hora e Listas
        (function() {
            const agora = new Date();
            document.getElementById('dataAtividade').value = agora.toISOString().split('T')[0];
            document.getElementById('horaAtividade').value = agora.toTimeString().split(' ')[0].substring(0, 5);
            document.getElementById('displayData').innerText = agora.toLocaleDateString('pt-BR');
            renderizarNomes();
        })();
    </script>
</body>
</html>
